# ═══════════════════════════════════════════════════════════════════════
# Fire Compliance OS — Production nginx configuration
# Save as: /etc/nginx/sites-available/fireos
# Symlink:  ln -s /etc/nginx/sites-available/fireos /etc/nginx/sites-enabled/
# SSL via:  certbot --nginx -d app.yourdomain.com
# ═══════════════════════════════════════════════════════════════════════

# ── Rate limit zones (defense-in-depth alongside slowapi) ────────────
limit_req_zone $binary_remote_addr zone=api_global:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m   rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_payments:10m rate=2r/s;

# ── Upstream backend ──────────────────────────────────────────────────
upstream fireos_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.yourdomain.com;

    # ── SSL (managed by certbot) ──────────────────────────────────────
    # ssl_certificate     /etc/letsencrypt/live/app.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # ── Security headers (backstop; backend also sends) ──────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self)" always;

    # ── Upload limits ─────────────────────────────────────────────────
    client_max_body_size 30M;
    client_body_buffer_size 1M;

    # ── Gzip ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Logs ──────────────────────────────────────────────────────────
    access_log /var/log/nginx/fireos.access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/fireos.error.log warn;

    # ── API routes (FastAPI) ──────────────────────────────────────────
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://fireos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /api/payments/ {
        limit_req zone=api_payments burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://fireos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api_global burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://fireos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;   # Allow PDF generation
    }

    # ── Health probe (no rate limit) ─────────────────────────────────
    location = /api/health {
        proxy_pass http://fireos_backend;
        access_log off;
    }

    # ── Frontend (React build) ────────────────────────────────────────
    root /opt/fireos/app/frontend/build;
    index index.html;

    # PWA service worker — never cache (so updates roll out)
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hashed assets — cache forever
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
