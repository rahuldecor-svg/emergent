[program:fireos-backend]
command=/opt/fireos/app/backend/venv/bin/uvicorn server:app --host 127.0.0.1 --port 8001 --workers 2 --proxy-headers --forwarded-allow-ips=127.0.0.1
directory=/opt/fireos/app/backend
user=fireos
autostart=true
autorestart=true
startretries=5
stopwaitsecs=15
stopsignal=TERM
stderr_logfile=/var/log/fireos/backend.err.log
stdout_logfile=/var/log/fireos/backend.out.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
environment=PATH="/opt/fireos/app/backend/venv/bin",PYTHONUNBUFFERED="1"
